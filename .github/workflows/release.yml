# Every push to develop builds and tests the jar, packages the app natively with a bundled Java
# runtime (macOS Apple silicon and Intel, Windows x64, Linux x64 and arm64; plus a .dmg, .msi or
# .deb installer), smoke-tests each package and publishes everything as a GitHub Release
# (tag v<date>, v<date>-1, …, computed once and built into the jar so the app knows its version).
# Binaries are never committed to git: README links point to releases/latest/download/<file>.
# Platforms marked experimental may fail without blocking the release.
name: Build and release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

# Releases are published one after another, so two quick pushes never race for the same tag.
concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  jar:
    name: Jar (tests, checkstyle, coverage)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - id: tag
        run: echo "tag=$(scripts/release-tag.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mvn -B -ntp -Dcutenotes.release="${TAG#v}" clean install
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/cutenotes.jar
          if-no-files-found: error

  native:
    name: Package ${{ matrix.platform }}
    needs: jar
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: mac-arm64
            experimental: false
          - os: windows-latest
            platform: windows-x64
            experimental: false
          - os: ubuntu-latest
            platform: linux-x64
            experimental: false
          - os: macos-15-intel
            platform: mac-x64
            experimental: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - name: Package
        run: scripts/package.sh target/cutenotes.jar dist
      - name: Smoke test
        # Linux has always been checked; macOS and Windows desktops on CI are still being proven.
        continue-on-error: ${{ !startsWith(matrix.platform, 'linux') }}
        run: >-
          scripts/smoke-test.sh
          dist/cutenotes-${{ matrix.platform }}.${{ startsWith(matrix.platform, 'linux') && 'tar.gz' || 'zip' }}
      - name: Installer
        continue-on-error: true
        run: |
          INSTALLERS=1 scripts/package.sh target/cutenotes.jar installer
          cp installer/*.dmg installer/*.msi installer/*.deb dist/ 2> /dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [jar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: scripts/publish-release.sh dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.jar.outputs.tag }}
